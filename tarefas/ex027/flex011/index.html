<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: lightpink;
            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 250px;
        }

        /*Shrink = encolhimento
        grow = crescimento
        0 = (Negação) para ambos*/
        div#item1 {
            flex-shrink: 0;
            flex-grow: 0;
        }

        div#item2 {
            flex-shrink: 1;
            flex-grow: 1;
        }

        div#item3 {
            flex-shrink: 0;
            flex-grow: 0;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="item1">Opção A</div>
        <div class="item" id="item2">Opção B</div>
        <div class="item" id="item3">Opção C</div>
    </div>
</body>
</html>
