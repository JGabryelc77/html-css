<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout #2</title>
    <style>
        div.container { 
            border: 5px solid black;
            height: 250px;
            display: grid;
            grid-template: repeat(3, auto) / repeat(3, auto); /*Simplifica grid-template-rows 1º e grid-template-columns 2º*/
            gap: 5px;
            place-items: start justify; /*Simplifica align-items e justify-items*/
            place-content: space-between end; /*Simplifica align-content e justify-content*/
        }

        div.item {

            border: 3px solid chartreuse;
            padding: 5px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
    </div>
</body>
</html>
